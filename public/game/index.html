<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#9a3d4d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>PINK MENACE</title>
      <link rel="stylesheet" href="/shared/app.css?v=p62">
</head>
<body>
  <main class="shell">
    <div class="top" id="gate-top">
      <div class="brand">
        <h1>PINK MENACE</h1>
        <p>The Quarantine Runs</p>
      </div>
    </div>

    <header id="play-header" class="play-header hidden">
      <button type="button" id="hdr-back" class="hdr-btn" aria-label="Log">Log</button>
      <div class="hdr-mid">
        <p id="hdr-title" class="hdr-title">PINK MENACE</p>
        <p id="hdr-chip" class="hdr-chip hidden"></p>
      </div>
      <button type="button" id="hdr-home" class="hdr-btn" aria-label="Home">Home</button>
    </header>

    <section id="gate" class="panel">
      <label>
        Phone
        <input id="phone" type="tel" inputmode="tel" autocomplete="tel" maxlength="20">
      </label>
      <div class="actions">
        <button id="send-pin" type="button">Send PIN</button>
      </div>
      <form id="pin-form" class="hidden" action="#" method="post">
        <div id="pin-wrap" class="hidden">
        <label>
          PIN
          <input id="pin" name="one-time-code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]*">
        </label>
        <div class="actions">
          <button id="enter" type="button">Enter</button>
        </div>
        </div>
      </form>
      <p id="gate-msg" class="msg"></p>
    </section>

    <section id="confirm" class="panel hidden" role="dialog" aria-modal="true">
      <p id="confirm-q" class="decision"></p>
      <div class="actions">
        <button id="confirm-yes" type="button">Yes</button>
        <button id="confirm-no" class="ghost" type="button">No</button>
      </div>
    </section>

    <section id="app" class="hidden">
      <div id="home" class="home hidden">
        <button id="resume" class="resume" type="button"></button>
        <button id="start-over" class="ghost start-over hidden" type="button">Start over</button>
        <article id="locked-door" class="locked-door hidden">
          <p class="act-name" id="locked-door-title"></p>
          <p class="meta">Locked</p>
        </article>
        <div id="acts" class="act-list"></div>
        <article class="act-row locked" id="pass-row">
          <p class="act-name">The pass</p>
          <p class="meta" id="pass-meta">Locked. The herd is on it.</p>
          <span class="act-meter" aria-hidden="true"><i id="pass-fill"></i></span>
        </article>
        <h2 class="home-h">The Log</h2>
        <div id="log" class="list"></div>
        <h2 class="home-h">The Cast</h2>
        <div id="cast" class="cast-list"></div>
        <button id="sign-out" class="ghost sign-out" type="button">Sign out</button>
      </div>
      <div id="run" class="panel hidden">
        <div id="dash" class="dash">
          <div id="cooler-tag" class="cooler-tag" aria-live="polite">
            <span class="cooler-label" id="cooler-name">CARGO</span>
            <span id="cooler-min">130 MIN</span>
            <span id="cooler-delta" class="cooler-delta hidden"></span>
            <span id="cooler-float" class="cooler-float hidden"></span>
          </div>
          <ul class="meters">
            <li id="meter-noise" data-band="low"><span class="meter-word" id="mw-noise">● Quiet</span><b><i id="m-noise"></i></b><span class="meter-num" id="mn-noise">0</span></li>
            <li id="meter-light" data-band="low"><span class="meter-word" id="mw-light">● Dark</span><b><i id="m-light"></i></b><span class="meter-num" id="mn-light">0</span></li>
            <li id="meter-yaw" data-band="low"><span class="meter-word" id="mw-yaw">● Straight</span><b><i id="m-yaw"></i></b><span class="meter-num" id="mn-yaw">0</span></li>
          </ul>
        </div>
        <div id="shot-wrap" class="shot-wrap hidden">
          <div id="shot-ken" class="shot-ken">
            <img id="shot" class="shot" alt="" width="768" height="1152" decoding="async">
          </div>
          <div id="wx-rain" class="wx-rain hidden"></div>
          <div id="wx-fog" class="wx-fog hidden"></div>
          <div id="vignette" class="vignette"></div>
          <div id="fear-root" class="fear-root" aria-hidden="true">
            <div class="fear-prints"></div>
            <div class="fear-palm"></div>
          </div>
          <div id="hold" class="hold hidden" aria-hidden="true">
            <div class="hold-herd"></div>
            <div class="hold-contact"></div>
            <div id="hold-walkers" class="hold-walkers"></div>
            <div class="hold-prints"></div>
            <div class="hold-palm"></div>
            <div class="hold-fog"></div>
          </div>
          <div id="bark" class="bark hidden">
            <img id="bark-face" alt="">
            <p id="bark-line"></p>
          </div>
          <button type="button" id="shot-close" class="shot-close">Close</button>
          <p id="shot-hint" class="shot-hint hidden">Tap the picture</p>
        </div>
        <p id="card-kind" class="card-kind hidden"></p>
        <h2 id="title"></h2>
        <p id="hook" class="hook hidden"></p>
        <p id="scene" class="scene hidden"></p>
        <p id="decision" class="decision"></p>
        <div id="choice-dock" class="choice-dock">
          <div id="hazard-clock" class="hazard-clock hidden">
            <div class="hazard-head"><span id="hazard-kind">Hazard</span><span id="hazard-sec"></span></div>
            <i id="hazard-fill"></i>
          </div>
          <div id="recap-clock" class="hazard-clock hidden">
            <div class="hazard-head"><span>Recap</span><span id="recap-sec"></span></div>
            <i id="recap-fill"></i>
          </div>
          <div id="options" class="options"></div>
          <p id="answer-err" class="msg hidden"></p>
          <p id="result" class="result hidden"></p>
          <div id="debrief" class="result hidden"></div>
          <div class="actions">
            <button id="continue" class="hidden" type="button">Continue</button>
            <button id="play-again" class="hidden" type="button">Play again</button>
            <button id="resume-live" class="ghost hidden" type="button">Resume</button>
          </div>
        </div>
        <button type="button" id="choices-below" class="choices-below hidden">Choices below</button>
        <div id="manifest" class="manifest hidden">
          <div class="clipboard">
            <div class="clipboard-clip" aria-hidden="true"></div>
            <div class="log-sheet">
              <p class="log-row"><span>RUN</span><b id="man-run"></b></p>
              <p class="log-row"><span>CARGO</span><b id="man-cargo"></b></p>
              <p class="log-row"><span>COLD REMAINING</span><b id="man-cold"></b></p>
              <p class="log-row"><span>FOR</span><b id="man-for"></b></p>
              <button type="button" id="manifest-sign" class="manifest-sign">
                <span>DRIVER</span>
                <b id="manifest-sig"></b>
              </button>
            </div>
          </div>
        </div>
        <div id="delivery" class="delivery hidden" role="dialog" aria-live="polite">
          <p id="delivery-copy"></p>
          <button type="button" id="delivery-continue">Continue</button>
        </div>
        <div id="ignition" class="ignition hidden">
          <div class="ignition-dash" aria-hidden="true">
            <span class="ign-lamp"></span>
            <span class="ign-lamp"></span>
            <span class="ign-lamp"></span>
            <span class="ign-lamp"></span>
            <div class="ignition-gauges">
              <div class="ignition-face"><b id="ignition-needle"></b></div>
              <div class="ignition-face"><b id="ignition-needle-2"></b></div>
            </div>
          </div>
          <button type="button" id="ignition-catch" aria-label="Tap to crank">tap to crank</button>
        </div>
        <div id="collapse" class="collapse hidden">
          <p id="collapse-copy"></p>
          <button type="button" id="collapse-continue">Continue</button>
        </div>
        <div id="reward" class="reward hidden" role="dialog" aria-live="polite">
          <div class="reward-card">
            <img id="reward-img" class="reward-img hidden" alt="" width="320" height="320" decoding="async">
            <p id="reward-msg"></p>
          </div>
        </div>
      </div>
    </section>
  </main>
  <script src="/shared/auth.js?v=p32"></script>
  <script src="/feel.js?v=p56"></script>
  <script src="/app.js?v=p53"></script>
</body>
</html>
