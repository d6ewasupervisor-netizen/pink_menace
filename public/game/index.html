<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#9a3d4d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>PINK MENACE</title>
  <link rel="stylesheet" href="/shared/app.css">
</head>
<body>
  <main class="shell">
    <div class="top">
      <div class="brand">
        <h1>PINK MENACE</h1>
        <p>The Quarantine Runs</p>
      </div>
      <button id="sign-out" class="ghost hidden" type="button">Sign out</button>
    </div>

    <section id="gate" class="panel">
      <label>
        Phone
        <input id="phone" type="tel" inputmode="tel" autocomplete="tel" maxlength="20">
      </label>
      <div class="actions">
        <button id="send-pin" type="button">Send PIN</button>
      </div>
      <div id="pin-wrap" class="hidden">
        <label>
          PIN
          <input id="pin" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]*">
        </label>
        <div class="actions">
          <button id="enter" type="button">Enter</button>
        </div>
      </div>
      <p id="gate-msg" class="msg"></p>
    </section>

    <section id="app" class="hidden">
      <div class="panel play">
        <h2 id="who"></h2>
        <p id="status">Act II</p>
      </div>
    </section>
  </main>
  <script src="/shared/auth.js"></script>
  <script src="/app.js"></script>
</body>
</html>
