<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Art review</title>
  <link rel="stylesheet" href="/app.css?v=takes">
</head>
<body>
  <header class="bar">
    <p class="brand">Art review</p>
    <nav id="acts" class="acts"></nav>
    <button type="button" id="phone" class="ghost">390</button>
    <p id="counts" class="counts"></p>
  </header>

  <main class="stage">
    <div class="still-col">
      <figure class="still" id="still-wrap">
        <img id="still" alt="">
        <p id="missing" class="missing hidden">No still</p>
      </figure>
      <nav id="takes" class="takes" hidden></nav>
    </div>

    <section class="copy">
      <p id="kicker" class="kicker"></p>
      <h1 id="title"></h1>
      <p id="hook" class="hook"></p>
      <p id="scene" class="scene"></p>
      <p id="decision" class="decision"></p>
      <ol id="options" class="options" hidden></ol>
      <p id="read" class="read"></p>
      <p id="geo" class="geo"></p>
      <nav id="tags" class="tags"></nav>
      <p id="route" class="route hidden"></p>
      <p id="caveat" class="route hidden"></p>
      <label class="note-lab">
        Detail
        <textarea id="note" rows="3" maxlength="800"></textarea>
      </label>
    </section>
  </main>

  <nav id="strip" class="strip"></nav>

  <footer class="dock">
    <button type="button" id="prev" class="ghost">Prev</button>
    <button type="button" id="next" class="ghost">Next</button>
  </footer>

  <script src="/app.js?v=takes"></script>
</body>
</html>
